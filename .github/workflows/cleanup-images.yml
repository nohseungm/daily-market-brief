name: Cleanup old images

# 인스타 게시가 끝나고 14일 지난 이미지는 삭제 (인스타에는 이미 저장돼 있음). 기록 파일(json·caption)은 유지.
on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove images of posts published 14+ days ago
        run: |
          python3 - <<'EOF'
          import datetime, glob, json, os
          cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=14)
          for p in glob.glob("posts/*/published.json"):
              d = os.path.dirname(p)
              try:
                  t = datetime.datetime.strptime(json.load(open(p))["published_at"], "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=datetime.timezone.utc)
              except (KeyError, ValueError):
                  continue
              if t < cutoff:
                  for f in glob.glob(f"{d}/*.jpg"):
                      os.remove(f)
                      print("removed", f)
          EOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A posts
          git diff --cached --quiet || (git commit -m "cleanup images $(date -u +%F)" && git push)
